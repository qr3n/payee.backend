stages:
  - lint
  - test
  - build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  TELEGRAM_BOT_TOKEN: "1234567890:ci_dummy_token"
  TELEGRAM_WEBHOOK_SECRET: "ci_dummy_webhook_secret"

# ==============================================================================
# Reusable base template for Python / uv jobs
# ==============================================================================
.python-base:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  cache:
    key:
      files:
        - services/api/uv.lock
        - services/bot/uv.lock
    paths:
      - .uv-cache
  before_script:
    - uv sync --directory services/api --frozen
    - uv sync --directory services/bot --frozen

# ==============================================================================
# Stage: Lint & Code Quality
# ==============================================================================
lint:code-quality:
  extends: .python-base
  stage: lint
  script:
    - uv run --directory services/api ruff check .
    - uv run --directory services/api ruff format --check .
    - uv run --directory services/bot ruff check .
    - uv run --directory services/bot ruff format --check .

lint:type-check:
  extends: .python-base
  stage: lint
  script:
    - uv run --directory services/api mypy app tests
    - uv run --directory services/bot mypy bot tests

# ==============================================================================
# Stage: Automated Tests
# ==============================================================================
test:python-3.12:
  extends: .python-base
  stage: test
  script:
    - uv run --directory services/api pytest -v --maxfail=1
    - uv run --directory services/bot pytest -v --maxfail=1

test:python-3.13:
  extends: .python-base
  stage: test
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  script:
    - uv run --directory services/api pytest -v --maxfail=1
    - uv run --directory services/bot pytest -v --maxfail=1

# ==============================================================================
# Stage: Docker Compose & Image Builds
# ==============================================================================
docker:build-check:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker compose config > /dev/null
    - docker compose -f docker-compose.prod.yml config > /dev/null
    - docker compose build
    - docker compose -f docker-compose.prod.yml build
