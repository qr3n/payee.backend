name: deepseek-stateful-wrapper

services:
  deepseek-proxy:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CONVERSATION_TTL_SECONDS: ${CONVERSATION_TTL_SECONDS:-3600}
      MAX_CONVERSATIONS: ${MAX_CONVERSATIONS:-100}
      UPSTREAM_RETRIES: ${UPSTREAM_RETRIES:-3}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      FILE_PROCESS_TIMEOUT_SECONDS: ${FILE_PROCESS_TIMEOUT_SECONDS:-180}
      FILE_POLL_INTERVAL_SECONDS: ${FILE_POLL_INTERVAL_SECONDS:-1}
    ports:
      - "127.0.0.1:${PROXY_PORT:-28080}:8000"
