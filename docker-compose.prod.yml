x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

services:
  traefik:
    image: traefik:v3.7
    container_name: traefik_prod
    command:
      - "--configfile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/traefik.prod.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_acme:/etc/traefik/acme
    environment:
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
    env_file:
      - path: .env
        required: false
    networks:
      - gateway
    restart: always
    logging: *default-logging

  postgres:
    image: postgres:17-alpine
    container_name: postgres_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gateway
    restart: always
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: redis_prod
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - gateway
    restart: always
    logging: *default-logging

  migration:
    build:
      context: ./services/api
      dockerfile: Dockerfile
      target: production
      network: host
    image: fastapi-template-api:prod
    container_name: fastapi_migration_prod
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - RUN_MIGRATIONS=false
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-app}
    env_file:
      - path: .env
        required: false
    networks:
      - gateway
    restart: "no"
    logging: *default-logging

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
      target: production
      network: host
    image: fastapi-template-api:prod
    container_name: fastapi_api_prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - RUN_MIGRATIONS=false
      - GRANIAN_WORKERS=4
      - GRANIAN_LOG_ACCESS_ENABLED=true
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-app}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${API_HOST:-api.example.com}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.middlewares=compress@file,security-headers@file,api-ratelimit@file"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    networks:
      - gateway
    restart: always
    logging: *default-logging

  worker:
    build:
      context: ./services/api
      dockerfile: Dockerfile
      target: production
      network: host
    image: fastapi-template-api:prod
    container_name: fastapi_worker_prod
    command: ["taskiq", "worker", "app.core.broker:broker", "--fs-discover", "--workers", "2"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - RUN_MIGRATIONS=false
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-app}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - path: .env
        required: false
    networks:
      - gateway
    restart: always
    logging: *default-logging

  bot:
    build:
      context: ./services/bot
      dockerfile: Dockerfile
      target: production
      network: host
    image: fastapi-template-bot:prod
    container_name: fastapi_bot_prod
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_MODE=${TELEGRAM_BOT_MODE:-webhook}
      - TELEGRAM_WEBHOOK_URL=${TELEGRAM_WEBHOOK_URL:-https://${BOT_HOST:-bot.example.com}/webhook}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - TELEGRAM_DROP_PENDING_UPDATES=true
      - API_BASE_URL=http://api:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_FSM_DB=1
    env_file:
      - path: .env
        required: false
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bot.rule=Host(`${BOT_HOST:-bot.example.com}`)"
      - "traefik.http.routers.bot.entrypoints=websecure"
      - "traefik.http.routers.bot.tls=true"
      - "traefik.http.routers.bot.tls.certresolver=letsencrypt"
      - "traefik.http.routers.bot.middlewares=compress@file,security-headers@file"
      - "traefik.http.services.bot.loadbalancer.server.port=8080"
    networks:
      - gateway
    restart: always
    logging: *default-logging


volumes:
  traefik_acme:
    name: fastapi_traefik_acme
  postgres_prod_data:
    name: fastapi_postgres_prod_data
  redis_prod_data:
    name: fastapi_redis_prod_data

networks:
  gateway:
    name: gateway
    driver: bridge
