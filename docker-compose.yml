services:
  traefik:
    image: traefik:v3.7
    container_name: traefik_dev
    command:
      - "--configfile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic:/etc/traefik/dynamic:ro
    env_file:
      - path: .env
        required: false
    networks:
      - gateway
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: postgres_dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gateway
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis_dev
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gateway
    restart: unless-stopped

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
      target: development
    image: fastapi-template-api:dev
    container_name: fastapi_api_dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # Mount local app directory for hot-reloading in development
      - ./services/api/app:/app/app:ro
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - RUN_MIGRATIONS=true
      - GRANIAN_RELOAD=true
      - GRANIAN_LOG_ACCESS_ENABLED=true
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-app}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_PROVIDER=${AI_PROVIDER:-deepseek}
      - DEEPSEEK_PROXY_URL=${DEEPSEEK_PROXY_URL:-http://deepseek:8000}
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${API_HOST:-api.localhost}`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.middlewares=compress@file,security-headers@file,api-ratelimit@file"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    networks:
      - gateway
    restart: unless-stopped

  worker:
    build:
      context: ./services/api
      dockerfile: Dockerfile
      target: development
    image: fastapi-template-api:dev
    container_name: fastapi_worker_dev
    command: ["taskiq", "worker", "app.core.broker:broker", "--fs-discover", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/api/app:/app/app:ro
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - RUN_MIGRATIONS=false
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-app}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - path: .env
        required: false
    networks:
      - gateway
    restart: unless-stopped

  bot:
    build:
      context: ./services/bot
      dockerfile: Dockerfile
      target: development
    image: fastapi-template-bot:dev
    container_name: fastapi_bot_dev
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Mount local bot directory for hot-reloading in development
      - ./services/bot/bot:/app/bot:ro
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-1234567890:mock_token_for_dev}
      - TELEGRAM_BOT_MODE=${TELEGRAM_BOT_MODE:-polling}
      - TELEGRAM_DROP_PENDING_UPDATES=true
      - API_BASE_URL=http://api:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_FSM_DB=1
    env_file:
      - path: .env
        required: false
    networks:
      - gateway
    restart: unless-stopped

  deepseek:
    build:
      context: ./services/deepseek
      dockerfile: Dockerfile
    image: fastapi-template-deepseek:latest
    container_name: deepseek_proxy_dev
    environment:
      - DS_SESSION_ID=${DS_SESSION_ID:-}
      - AUTHORIZATION_TOKEN=${AUTHORIZATION_TOKEN:-}
    env_file:
      - path: .env
        required: false
    ports:
      - "${DEEPSEEK_PROXY_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gateway
    restart: unless-stopped

volumes:
  postgres_dev_data:
    name: fastapi_postgres_dev_data
  redis_dev_data:
    name: fastapi_redis_dev_data

networks:
  gateway:
    name: gateway
    driver: bridge
