[project]
name = "api-service"
version = "0.1.0"
description = "FastAPI Service Template powered by Granian, uvloop, orjson, and uv"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.141.0",
    "granian[reload,uvloop]>=1.0.0",
    "greenlet>=3.1.0",
    "orjson>=3.10.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "redis[hiredis]>=5.2.0",
    "sqlmodel>=0.0.22",
    "structlog>=26.1.0",
    "taskiq[reload]>=0.12.6",
    "taskiq-fastapi>=0.5.0",
    "taskiq-redis>=1.2.3",
    "uuid6>=2025.0.1",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "telethon>=1.38.0",
    "python-socks[asyncio]>=2.6.0",
    "cryptg>=0.4.0",
    "python-multipart>=0.0.18",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "fakeredis>=2.38.0",
    "httpx>=0.28.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "testcontainers[postgres]>=4.9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
